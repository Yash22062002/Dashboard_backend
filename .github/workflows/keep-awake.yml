name: Keep backend awake

# Optional. Render's free tier spins a web service down after 15 minutes
# with no incoming traffic, and spins it back up on the next plain HTTP
# request (unlike Streamlit Community Cloud, no real browser session is
# needed here). This just pings the health route often enough that the
# service never goes idle.
#
# Replace the URL below with your real Render service URL before enabling
# this. If you would rather accept an occasional cold start on the first
# visitor after a quiet stretch, simply delete this file.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://your-backend-url.onrender.com/health || true
